<div class="hero wrap" id="top">
  <p class="label">{{ ui.hero.hello | t }}</p>

  <h1>
    {{ p.name }}<span class="dot">.</span>
  </h1>

  <p class="role">{{ p.role }}</p>
  <p class="intro">{{ p.intro | t }}</p>

  <div class="actions">
    <a href="#contact" class="btn primary">{{ ui.hero.contact | t }}</a>
    <a href="#experience" class="btn">{{ ui.hero.work | t }}</a>
  </div>

  <dl class="facts">
    <div>
      <dt>{{ ui.hero.basedIn | t }}</dt>
      <dd>{{ p.location | t }}</dd>
    </div>
    <div>
      <dt>{{ ui.hero.experience | t }}</dt>
      <dd>{{ years }}+ {{ ui.hero.years | t }}</dd>
    </div>
    <div>
      <dt>stack</dt>
      <dd>Java · Angular · Cloud</dd>
    </div>
  </dl>
</div>
