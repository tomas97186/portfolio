<div class="hero wrap" id="top">
  <p class="label">// hello, I'm</p>

  <h1>
    {{ p.name }}<span class="dot">.</span>
  </h1>

  <p class="role">{{ p.role }}</p>
  <p class="intro">{{ p.intro }}</p>

  <div class="actions">
    <a href="#contact" class="btn primary">Get in touch</a>
    <a href="#experience" class="btn">See my work →</a>
  </div>

  <dl class="facts">
    <div>
      <dt>based in</dt>
      <dd>{{ p.location }}</dd>
    </div>
    <div>
      <dt>experience</dt>
      <dd>{{ years }}+ years</dd>
    </div>
    <div>
      <dt>stack</dt>
      <dd>Java · Angular · Cloud</dd>
    </div>
  </dl>
</div>
