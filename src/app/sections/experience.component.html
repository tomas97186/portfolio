<section id="experience">
  <div class="wrap">
    <p class="label">02 / experience</p>
    <h2>Where I've been working.</h2>

    <ol class="jobs">
      @for (job of jobs; track job.role; let i = $index) {
        <li appReveal [class.open]="opened() === i">
          <button class="head" (click)="toggle(i)" [attr.aria-expanded]="opened() === i">
            <span class="period">{{ job.from }} — {{ job.to }}</span>
            <span class="role">{{ job.role }}</span>
            <span class="company">{{ job.company }}</span>
            <span class="icon">+</span>
          </button>

          @if (opened() === i) {
            <div class="body">
              <p>{{ job.text }}</p>
              <div class="tags">
                @for (t of job.tags; track t) {
                  <span class="tag">{{ t }}</span>
                }
              </div>
            </div>
          }
        </li>
      }
    </ol>
  </div>
</section>
